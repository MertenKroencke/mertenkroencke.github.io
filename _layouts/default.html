<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
      color: #222;
    }
    nav {
      border-bottom: 1px solid #ddd;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
    }
    nav a {
      margin-right: 1.5rem;
      text-decoration: none;
      font-weight: 600;
      color: #0056b3;
    }
    nav a:hover {
      text-decoration: underline;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }
    .profile-container {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    
    .profile-left {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .profile-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }
    
    .profile-links {
      margin-top: 1rem;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 1.2rem;
    }
    
    .profile-links-single {
      margin-top: 0.8rem;
    }
    
    .profile-links a {
      color: #0056b3;
      display: flex;
      align-items: center;
    }
    
    .profile-links a:hover {
      color: #003a7a;
    }
    
    .profile-right {
      flex: 1 1 320px;
      min-width: 260px;
    }
    
    .profile-right h1 {
      margin-top: 0;
    }
    
    @media (max-width: 600px) {
      .profile-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/publications/' | relative_url }}">CV</a>
    <a href="{{ '/publications/' | relative_url }}">Publications</a>
    <a href="{{ '/publications/' | relative_url }}">Talks</a>
    <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
  </nav>
  <main>
    {{ content }}
  </main>
</body>
</html>
