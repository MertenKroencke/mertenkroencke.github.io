<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      line-height: 1.6;
      color: #222;
    }
    .site-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
    }
    .site-header .site-title {
      text-decoration: none;
      color: #222;
      font-size: 1.4rem;
      font-weight: 700;
      margin-right: 1.5rem;
    }
    .site-header .site-title:hover {
      color: #0056b3;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      margin-left: auto;
    }
    nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      font-weight: 600;
      color: #0056b3;
    }
    nav a:hover {
      text-decoration: underline;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
    }
    .profile-container {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    
    .profile-left {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .profile-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }
    .profile-right p:first-child {
      margin-top: -1.15rem;
    }
    .profile-img {
      margin-top: 0.35rem;
    }
    
    .profile-links {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }
    
    .profile-links a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #0056b3;
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .profile-links a:hover {
      text-decoration: underline;
    }
    
    .profile-right {
      flex: 1 1 320px;
      min-width: 260px;
    }
    
    .profile-right h1 {
      margin-top: 0;
    }
    
    @media (max-width: 600px) {
      .profile-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .profile-links a {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">Dr. Merten Kröncke</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/talks/' | relative_url }}">Talks</a>
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
    </nav>
  </div>
  <main>
    {{ content }}
  </main>
</body>
</html>
